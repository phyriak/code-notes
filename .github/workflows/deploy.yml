name: Build and Deploy Code Notes

on:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            phyriak/code-notes-backend:${{ github.sha }}
            phyriak/code-notes-backend:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            phyriak/code-notes-frontend:${{ github.sha }}
            phyriak/code-notes-frontend:latest


  deploy:

    needs: build

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to Hetzner
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/opt/apps/code-notes"

      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}

          script: |
            cd /opt/apps/code-notes

            echo "Pulling Docker images..."

            docker compose pull

            echo "Starting Code Notes..."

            docker compose up -d

            echo "Waiting for application..."

            for i in {1..12}; do
              if curl -f http://localhost:3200/api/health; then
                echo "Code Notes is UP"

                docker image prune -f

                exit 0
              fi

              echo "Application not ready yet..."
              sleep 10
            done

            echo "Code Notes failed to start"

            docker compose ps

            exit 1